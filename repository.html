<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Syncer - Repository</title>
    <link rel="icon" href="OIP.webp" type="image/webp">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        (function() {
            // Theme Loader
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.className = savedTheme;
            }

            // Font Size Loader
            const savedFontSize = localStorage.getItem('fontSize');
            if (savedFontSize) {
                document.documentElement.style.fontSize = savedFontSize + 'px';
                document.addEventListener('DOMContentLoaded', () => {
                   document.body.style.fontSize = savedFontSize + 'px';
                });
            }

            // Wallpaper Loader (Prevents Flash)
            const url = localStorage.getItem('wallpaper_url') || '';
            const imageData = localStorage.getItem('wallpaper_image_data') || '';
            const effect = localStorage.getItem('wallpaper_effect') || 'normal';
            const blur = localStorage.getItem('wallpaper_blur') || '5';
            const transparent = localStorage.getItem('wallpaper_transparent') === 'true';
            const opacity = localStorage.getItem('wallpaper_opacity') || '80';

            document.addEventListener('DOMContentLoaded', () => {
                let wallpaperDiv = document.getElementById('wallpaper-background');
                if (!wallpaperDiv) {
                    wallpaperDiv = document.createElement('div');
                    wallpaperDiv.id = 'wallpaper-background';
                    document.body.prepend(wallpaperDiv);
                }

                const hasImage = url || imageData;
                if (hasImage) {
                    wallpaperDiv.style.backgroundImage = `url('${imageData || url}')`;
                    wallpaperDiv.style.opacity = '1';
                    document.body.style.backgroundColor = 'transparent';
                } else {
                    wallpaperDiv.style.backgroundImage = 'none';
                    wallpaperDiv.style.opacity = '0';
                    document.body.style.backgroundColor = '';
                }

                if (effect === 'blur') {
                    wallpaperDiv.style.filter = `blur(${blur}px)`;
                } else {
                    wallpaperDiv.style.filter = 'none';
                }
            });
        })();
    </script>
</head>
<body>
    <div class="full-screen-layout" style="grid-template-columns: 1fr;">
        <header>
            <div style="display: flex; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="OIP.webp" alt="Logo" style="height: 32px; border-radius: 5px;">
                    <h1>Code Syncer</h1>
                </div>
                <nav class="main-nav" style="margin-left: 20px;">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="repository.html" class="nav-link active">Repository</a>
                    <a href="compiler.html" class="nav-link">Compiler</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                </nav>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; min-width: 40px;">
            </div>
        </header>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Configuration</h2>
                    <span id="closeSettingsBtn" class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="usernameInput">GitHub Username</label>
                        <input type="text" id="usernameInput" class="text-input" placeholder="e.g. johndoe">
                    </div>
                    <div class="form-group">
                        <label for="repoInput">Repository Name</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="repoInput" class="text-input" style="flex: 1;" placeholder="e.g. codesyncer">
                            <button id="createRepoBtn" class="btn btn-small" title="Create this repository on GitHub">Create Repo</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="tokenInput">GitHub Personal Access Token</label>
                        <input type="password" id="tokenInput" class="text-input" placeholder="ghp_...">
                        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">
                            Token is stored locally. <a href="https://github.com/settings/tokens" target="_blank" style="color: var(--primary-color);">Generate a token</a> with 'repo' scope.
                        </p>
                    </div>

                    
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

                    <h3>Wallpaper Settings</h3>
                    <div class="form-group">
                        <label for="wallpaperUrlInput">Wallpaper URL</label>
                        <input type="text" id="wallpaperUrlInput" class="text-input" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label for="wallpaperFileInput">Or Upload Image</label>
                        <input type="file" id="wallpaperFileInput" class="text-input" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="wallpaperEffectSelect">Effect</label>
                        <select id="wallpaperEffectSelect" class="text-input">
                            <option value="normal">Normal</option>
                            <option value="blur">Blur</option>
                        </select>
                    </div>
                    <div class="form-group" style="display: none; align-items: center; gap: 10px;">
                        <label for="wallpaperBlurRange" style="margin: 0;">Blur Level:</label>
                        <input type="range" id="wallpaperBlurRange" min="0" max="20" value="5" style="flex: 1;">
                        <span id="wallpaperBlurValue">5px</span>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                        <input type="checkbox" id="wallpaperTransparentCheckbox">
                        <label for="wallpaperTransparentCheckbox" style="margin: 0;">Transparent Containers</label>
                    </div>
                    <div class="form-group" id="wallpaperOpacityGroup" style="display: none; align-items: center; gap: 10px;">
                        <label for="wallpaperOpacityRange" style="margin: 0;">Opacity:</label>
                        <input type="range" id="wallpaperOpacityRange" min="0" max="100" value="80" style="flex: 1;">
                        <span id="wallpaperOpacityValue">0.8</span>
                    </div>
                    
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
                    
                    <h3>Folder Security</h3>
                    <div class="form-group">
                        <label for="folderPassInput">Folder Password (Default: 0000)</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="password" id="folderPassInput" class="text-input" style="flex: 1;" placeholder="New Password">
                            <button id="changeFolderPassBtn" class="btn btn-small">Change</button>
                        </div>
                    </div>

                    <button id="saveTokenBtn" class="btn">Save Configuration</button>
                </div>
            </div>
        </div>

        <!-- File View Modal -->
        <div id="fileViewModal" class="modal file-view-modal">
            <div class="modal-content file-view-content full-screen">
                <div class="modal-header">
                    <h2 id="viewFileName">Filename.ext</h2>
                    <div class="file-view-controls" style="display: flex; gap: 10px; align-items: center; margin-left: 20px; flex-grow: 1; justify-content: flex-end; margin-right: 10px;">
                        <input type="text" id="fileSearchInput" placeholder="Find in file..." class="text-input" style="padding: 5px; height: 30px; width: 200px;">
                        <button id="fileSearchBtn" class="btn btn-small" title="Search Text" style="padding: 5px 10px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                    <span id="closeFileViewBtn" class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div id="viewFileDescription" class="file-description"></div>
                    <div class="code-container">
                        <div id="viewFileCode" class="code-block" style="white-space: pre-wrap; font-family: var(--font-family); color: var(--text-color); overflow: auto;"></div>
                    </div>
                    <div class="file-view-actions">
                        <button id="openInCompilerBtn" class="btn" style="background-color: var(--primary-color); color: var(--bg-color);">Open in Compiler</button>
                        <button id="downloadFileBtn" class="btn">Download File</button>
                        <button id="deleteViewFileBtn" class="btn btn-danger-icon">Delete File</button>
                        <button class="btn btn-secondary" onclick="document.getElementById('fileViewModal').style.display='none'">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="files-section" style="height: 100%;">
            <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>Repository</h2>
                <div style="display: flex; gap: 10px;">
                    <div class="view-switcher" style="display: flex; border: 1px solid var(--border-color); border-radius: var(--border-radius); overflow: hidden;">
                        <button id="listViewBtn" class="btn-icon active" title="List View" style="border: none; border-radius: 0; padding: 5px 10px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                        </button>
                        <button id="gridViewBtn" class="btn-icon" title="Grid View" style="border: none; border-radius: 0; padding: 5px 10px; border-left: 1px solid var(--border-color);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        </button>
                    </div>
                    <button id="createFileBtn" class="btn btn-small">New File</button>
                    <button id="createFolderBtn" class="btn btn-small">New Folder</button>
                    <button id="moveSelectedBtn" class="btn btn-small btn-secondary" style="display: none;">Move Selected</button>
                    <button id="loadBtn" class="btn btn-secondary">Refresh</button>
                </div>
            </div>
            <div class="form-group">
                <input type="text" id="searchInput" class="text-input" placeholder="Search files...">
            </div>
            <div id="breadcrumb" class="breadcrumb" style="margin-bottom: 10px; font-family: monospace; color: var(--primary-color);">
                <span class="breadcrumb-item" data-path="" style="cursor: pointer;">root</span>
            </div>
            <div id="savedCodes" class="saved-codes-container">
                <p class="empty-message">Initializing connection...</p>
            </div>
            <div id="status" class="status-message"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
