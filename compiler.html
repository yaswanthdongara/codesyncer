<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Syncer - Online Compiler</title>
    <link rel="icon" href="OIP.webp" type="image/webp">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        (function() {
            // Theme Loader
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.className = savedTheme;
            }

            // Font Size Loader
            const savedFontSize = localStorage.getItem('fontSize');
            if (savedFontSize) {
                document.documentElement.style.fontSize = savedFontSize + 'px';
                document.addEventListener('DOMContentLoaded', () => {
                   document.body.style.fontSize = savedFontSize + 'px';
                });
            }

            // Wallpaper Loader (Prevents Flash)
            const url = localStorage.getItem('wallpaper_url') || '';
            const imageData = localStorage.getItem('wallpaper_image_data') || '';
            const effect = localStorage.getItem('wallpaper_effect') || 'normal';
            const blur = localStorage.getItem('wallpaper_blur') || '5';
            const transparent = localStorage.getItem('wallpaper_transparent') === 'true';
            const opacity = localStorage.getItem('wallpaper_opacity') || '80';

            document.addEventListener('DOMContentLoaded', () => {
                let wallpaperDiv = document.getElementById('wallpaper-background');
                if (!wallpaperDiv) {
                    wallpaperDiv = document.createElement('div');
                    wallpaperDiv.id = 'wallpaper-background';
                    document.body.prepend(wallpaperDiv);
                }

                const hasImage = url || imageData;
                if (hasImage) {
                    wallpaperDiv.style.backgroundImage = `url('${imageData || url}')`;
                    wallpaperDiv.style.opacity = '1';
                    document.body.style.backgroundColor = 'transparent';
                } else {
                    wallpaperDiv.style.backgroundImage = 'none';
                    wallpaperDiv.style.opacity = '0';
                    document.body.style.backgroundColor = '';
                }

                if (effect === 'blur') {
                    wallpaperDiv.style.filter = `blur(${blur}px)`;
                } else {
                    wallpaperDiv.style.filter = 'none';
                }
            });
        })();
    </script>
    <style>
        .compiler-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 100px);
            padding: 20px;
        }
        
        .editor-pane, .output-pane {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .pane-header {
            padding: 10px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-editor {
            flex: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: inherit;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .output-area {
            flex: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: inherit;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .run-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .run-btn:hover {
            opacity: 0.9;
        }

        .lang-select {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .compiler-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .editor-pane, .output-pane {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="full-screen-layout" style="grid-template-columns: 1fr;">
        <header>
            <div style="display: flex; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="OIP.webp" alt="Logo" style="height: 32px; border-radius: 5px;">
                    <h1>Code Syncer</h1>
                </div>
                <nav class="main-nav" style="margin-left: 20px;">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="repository.html" class="nav-link">Repository</a>
                    <a href="compiler.html" class="nav-link active">Compiler</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                </nav>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; min-width: 40px;">
                <!-- Theme selector removed -->
            </div>
        </header>

        <!-- Save Modal -->
        <div id="saveModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Save to Repository</h2>
                    <span id="closeSaveModalBtn" class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="filenameInput">Filename</label>
                        <input type="text" id="filenameInput" class="text-input" placeholder="e.g. script.js">
                    </div>
                    <div class="form-group">
                        <label for="fileDescriptionInput">Description (Optional)</label>
                        <textarea id="fileDescriptionInput" class="text-input" placeholder="Add a description for this file..." style="height: 60px; resize: vertical; font-family: inherit;"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="commitMessageInput">Commit Message (Optional)</label>
                        <input type="text" id="commitMessageInput" class="text-input" placeholder="Add new file">
                    </div>
                    <button id="confirmSaveBtn" class="btn">Save File</button>
                </div>
            </div>
        </div>



        <div class="compiler-container">
            <div class="editor-pane">
                <div class="pane-header">
                    <div style="display: flex; gap: 10px;">
                        <select id="languageSelect" class="lang-select">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                            <option value="html">HTML/CSS</option>
                            <option value="algorithm">Algorithm</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button id="clearBtn" class="btn btn-small" style="display: flex; align-items: center; gap: 5px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            Clear
                        </button>
                        <button id="saveBtn" class="btn btn-small" style="display: flex; align-items: center; gap: 5px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                            Save
                        </button>
                        <button id="runBtn" class="run-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            Run Code
                        </button>
                    </div>
                </div>
                <textarea id="codeEditor" class="code-editor" spellcheck="false">// Write your code here
console.log("Hello, World!");
</textarea>
            </div>
            <div class="output-pane">
                <div class="pane-header">
                    <span>Input</span>
                </div>
                <textarea id="inputArea" class="code-editor" style="height: 100px; flex: none; border-bottom: 1px solid var(--border-color); background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', 'Monaco', monospace;" placeholder="Enter input here..."></textarea>
                <div class="pane-header">
                    <span>Output</span>
                    <div style="display: flex; gap: 5px;">

                        <button id="outputClearBtn" class="btn btn-small">Clear Output</button>
                    </div>
                </div>
                <div id="outputArea" class="output-area"></div>
            </div>
        </div>


    </div>

    <script>
        const runBtn = document.getElementById('runBtn');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const codeEditor = document.getElementById('codeEditor');
        const outputArea = document.getElementById('outputArea');
        const inputArea = document.getElementById('inputArea');
        const languageSelect = document.getElementById('languageSelect');
        const themeSelect = document.getElementById('themeSelect');
        // Removed algorithmSelect reference

        // Algorithm Definitions removed as per request

        const snippets = {
            javascript: `// JavaScript Example
console.log("Hello from Code Syncer!");
const sum = (a, b) => a + b;
console.log("2 + 3 =", sum(2, 3));`,
            python: `# Python Example
def greet(name):
    return f"Hello, {name}!"

print(greet("Developer"))`,
            java: `// Java Example
public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from Java!");
    }
}`,
            html: `<!-- HTML Example -->
<div style="color: blue; font-weight: bold;">
    Hello from HTML!
</div>`,
            algorithm: `// Write your algorithm logic here
// You can use pseudo-code or any language style`
        };

        const pendingAlgo = localStorage.getItem('selected_algorithm');
        if (pendingAlgo) {
             localStorage.removeItem('selected_algorithm');
             // Try to set the select value
             languageSelect.value = pendingAlgo;
             // Trigger change manually
             languageSelect.dispatchEvent(new Event('change'));
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                if (confirm('Are you sure you want to reset the editor?')) {
                     // Determine current language base from the selection
                     const selected = languageSelect.value;
                     codeEditor.value = snippets[selected] || '';
                     // Update localStorage to match the cleared state
                     localStorage.setItem('autosave_code', codeEditor.value);
                }
            });
        }
        
        // Editor Enhancements (Auto-close, Indentation)
        codeEditor.addEventListener('keydown', (e) => {
            const start = codeEditor.selectionStart;
            const end = codeEditor.selectionEnd;
            const value = codeEditor.value;
            const char = e.key;

            const pairs = {
                '(': ')',
                '{': '}',
                '[': ']',
                '"': '"',
                "'": "'",
                '`': '`'
            };

            // Handle Tab (Insert spaces)
            if (char === 'Tab') {
                e.preventDefault();
                const before = value.substring(0, start);
                const after = value.substring(end);
                codeEditor.value = before + '    ' + after;
                codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
                return;
            }

            // Handle Enter (Automatic Indentation)
            if (char === 'Enter') {
                e.preventDefault();
                const prevChar = value.charAt(start - 1);
                const nextChar = value.charAt(start);
                const before = value.substring(0, start);
                const after = value.substring(end);
                
                // Calculate current indentation
                const lines = before.split('\n');
                const lastLine = lines[lines.length - 1];
                const indentation = lastLine.match(/^\s*/)[0];
                const trimmedLastLine = lastLine.trimEnd();
                const lastChar = trimmedLastLine.charAt(trimmedLastLine.length - 1);

                if ((prevChar === '{' && nextChar === '}') || 
                    (prevChar === '(' && nextChar === ')') || 
                    (prevChar === '[' && nextChar === ']')) {
                    // Enter between braces: indent inner line, then dedent closing brace
                    codeEditor.value = before + '\n' + indentation + '    \n' + indentation + after;
                    codeEditor.selectionStart = codeEditor.selectionEnd = start + indentation.length + 5; 
                } else if (lastChar === '{' || lastChar === '(' || lastChar === '[') {
                    // New line after opening brace: increment indent
                    codeEditor.value = before + '\n' + indentation + '    ' + after;
                    codeEditor.selectionStart = codeEditor.selectionEnd = start + indentation.length + 5;
                } else {
                    // Just maintain indentation
                    codeEditor.value = before + '\n' + indentation + after;
                    codeEditor.selectionStart = codeEditor.selectionEnd = start + indentation.length + 1;
                }
                return;
            }

            // Handle Backspace (Delete pair)
            if (char === 'Backspace') {
                const prevChar = value.charAt(start - 1);
                const nextChar = value.charAt(start);
                
                if ((prevChar === '(' && nextChar === ')') ||
                    (prevChar === '{' && nextChar === '}') ||
                    (prevChar === '[' && nextChar === ']') ||
                    (prevChar === '"' && nextChar === '"') ||
                    (prevChar === "'" && nextChar === "'") ||
                    (prevChar === '`' && nextChar === '`')) {
                    e.preventDefault();
                    codeEditor.value = value.substring(0, start - 1) + value.substring(end + 1);
                    codeEditor.selectionStart = codeEditor.selectionEnd = start - 1;
                    return;
                }
            }

            // Handle closing characters (Skip if already present)
            if (Object.values(pairs).includes(char)) {
                // Only skip if it's the exact next character and not inside a string/comment (simplified check)
                if (value.charAt(start) === char) {
                    e.preventDefault();
                    codeEditor.selectionStart = codeEditor.selectionEnd = start + 1;
                    return;
                }
            }

            // Handle opening characters (Auto-close)
            if (pairs[char]) {
                // Don't auto-close if typing a quote inside a word
                if ((char === '"' || char === "'" || char === '`') && 
                    start > 0 && /\w/.test(value.charAt(start - 1))) {
                    return;
                }

                e.preventDefault();
                const before = value.substring(0, start);
                const selected = value.substring(start, end);
                const after = value.substring(end);
                
                if (start !== end) {
                    // Wrap selection
                    codeEditor.value = before + char + selected + pairs[char] + after;
                    codeEditor.selectionStart = start;
                    codeEditor.selectionEnd = end + 2;
                } else {
                    // Insert pair
                    codeEditor.value = before + char + pairs[char] + after;
                    codeEditor.selectionStart = codeEditor.selectionEnd = start + 1;
                }
            }
        });

        const saveModal = document.getElementById('saveModal');
        const closeSaveModalBtn = document.getElementById('closeSaveModalBtn');
        const filenameInput = document.getElementById('filenameInput');
        const commitMessageInput = document.getElementById('commitMessageInput');
        const fileDescriptionInput = document.getElementById('fileDescriptionInput');
        const confirmSaveBtn = document.getElementById('confirmSaveBtn');



        // Theme handling
        if (themeSelect) {
            themeSelect.addEventListener('change', (e) => {
                const theme = e.target.value;
                document.documentElement.className = theme;
                localStorage.setItem('theme', theme);
            });
        }

        // Set initial theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            if (themeSelect) themeSelect.value = savedTheme;
            document.documentElement.className = savedTheme;
        }

        // Check for code from repository
        const importedCode = localStorage.getItem('compiler_code');
        const importedLang = localStorage.getItem('compiler_lang');
        const importedFilename = localStorage.getItem('compiler_filename');
        const lastUsedLang = localStorage.getItem('compiler_last_lang');
        const autosaveCode = localStorage.getItem('autosave_code');
        const autosaveLang = localStorage.getItem('autosave_lang');
        const autosaveFilename = localStorage.getItem('autosave_filename');

        if (importedCode) {
            // Priority 1: Code from Repository
            codeEditor.value = importedCode;
            if (importedLang) {
                languageSelect.value = importedLang;
                localStorage.setItem('compiler_last_lang', importedLang);
                localStorage.setItem('autosave_lang', importedLang);
            }
            if (importedFilename) {
                localStorage.setItem('autosave_filename', importedFilename);
            }
            localStorage.setItem('autosave_code', importedCode);
            
            // Clear storage so it doesn't persist on refresh/navigation
            localStorage.removeItem('compiler_code');
            localStorage.removeItem('compiler_lang');
            localStorage.removeItem('compiler_filename');
        } else if (autosaveCode) {
            // Priority 2: Autosaved code
            codeEditor.value = autosaveCode;
            if (autosaveLang) {
                languageSelect.value = autosaveLang;
            }
        } else if (lastUsedLang) {
            // Priority 3: Default snippet for last used language
            languageSelect.value = lastUsedLang;
            codeEditor.value = snippets[lastUsedLang] || '';
        }

        // Autosave functionality
        codeEditor.addEventListener('input', () => {
            localStorage.setItem('autosave_code', codeEditor.value);
        });

        languageSelect.addEventListener('change', () => {
            const lang = languageSelect.value;
            localStorage.setItem('compiler_last_lang', lang);
            localStorage.setItem('autosave_lang', lang);
            
            // Only overwrite if the current code is empty or matches one of the default snippets
            const currentCode = codeEditor.value.trim();
            const isDefaultSnippet = Object.values(snippets).some(s => s.trim() === currentCode);
            
            if (currentCode === '' || isDefaultSnippet || confirm("Changing language will reset the code editor. Continue?")) {
                codeEditor.value = snippets[lang] || '';
                localStorage.setItem('autosave_code', codeEditor.value);
                outputArea.innerHTML = '';
            } else {
                // Revert selection if cancelled (optional, but tricky without previous value)
                // For now, we just don't change the code, but the select value changed.
                // That's actually fine, maybe they just wanted to change the runner language but keep code.
            }
        });

        runBtn.addEventListener('click', async () => {
            const lang = languageSelect.value;
            const code = codeEditor.value;
            const input = inputArea.value;
            outputArea.innerHTML = '';

            if (lang === 'javascript') {
                try {
                    // Capture console.log
                    const originalLog = console.log;
                    const logs = [];
                    console.log = (...args) => {
                        logs.push(args.map(arg => 
                            typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
                        ).join(' '));
                    };

                    // Mock prompt for input
                    const originalPrompt = window.prompt;
                    const inputLines = input.split('\n');
                    let inputIndex = 0;
                    window.prompt = (message) => {
                        if (inputIndex < inputLines.length) {
                            return inputLines[inputIndex++];
                        }
                        return '';
                    };

                    // Execute code
                    eval(code);

                    // Restore console.log and prompt
                    console.log = originalLog;
                    window.prompt = originalPrompt;

                    // Display output
                    if (logs.length > 0) {
                        outputArea.innerText = logs.join('\n');
                    } else {
                        outputArea.innerText = 'Code executed successfully (no output).';
                    }
                } catch (error) {
                    outputArea.innerHTML = `<span style="color: var(--danger-color)">Error: ${error.message}</span>`;
                }
            } else if (lang === 'html') {
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.style.background = 'white';
                outputArea.appendChild(iframe);
                
                const doc = iframe.contentWindow.document;
                doc.open();
                doc.write(code);
                doc.close();
            } else {
                // Piston API for Python and Java
                outputArea.innerText = 'Running code...';
                
                try {
                    const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            language: lang,
                            version: lang === 'java' ? '15.0.2' : '3.10.0',
                            files: [
                                {
                                    content: code
                                }
                            ],
                            stdin: input
                        })
                    });

                    const data = await response.json();
                    
                    if (data.run) {
                        outputArea.innerText = data.run.output;
                    } else {
                        outputArea.innerText = 'Error executing code: ' + (data.message || 'Unknown error');
                    }
                } catch (error) {
                    outputArea.innerText = 'Network Error: ' + error.message;
                }
            }
        });

        // Save Functionality
        saveBtn.addEventListener('click', () => {
            const lang = languageSelect.value;
            let ext = '.txt';
            let folder = '';

            if (lang === 'javascript') {
                ext = '.js';
                folder = 'javascript/';
            } else if (lang === 'python') {
                ext = '.py';
                folder = 'python/';
            } else if (lang === 'java') {
                ext = '.java';
                folder = 'java/';
            } else if (lang === 'html') {
                ext = '.html';
                folder = 'html/';
            }
            
            // Suggest a filename
            const currentFilename = localStorage.getItem('autosave_filename');
            if (currentFilename) {
                filenameInput.value = currentFilename;
            } else {
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                filenameInput.value = `${folder}snippet_${timestamp}${ext}`;
            }
            
            saveModal.style.display = 'block';
        });

        closeSaveModalBtn.addEventListener('click', () => {
            saveModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === saveModal) {
                saveModal.style.display = 'none';
            }
        });

        confirmSaveBtn.addEventListener('click', async () => {
            const token = localStorage.getItem('github_token');
            const owner = localStorage.getItem('github_username');
            const repo = localStorage.getItem('github_repo');
            const code = codeEditor.value;
            const filename = filenameInput.value.trim();
            const message = commitMessageInput.value.trim() || `Add ${filename}`;

            if (!token || !owner || !repo) {
                alert('Please configure your GitHub settings in the Repository page first.');
                return;
            }

            if (!filename) {
                alert('Please enter a filename.');
                return;
            }

            confirmSaveBtn.disabled = true;
            confirmSaveBtn.innerText = 'Saving...';

            try {
                // Check if file exists to get SHA (for update)
                let sha = null;
                try {
                    const checkResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (checkResponse.ok) {
                        const data = await checkResponse.json();
                        sha = data.sha;
                        if (!confirm(`File ${filename} already exists. Overwrite?`)) {
                            confirmSaveBtn.disabled = false;
                            confirmSaveBtn.innerText = 'Save File';
                            return;
                        }
                    }
                } catch (e) {
                    // Ignore error if file doesn't exist
                }

                // Create file content with metadata header
                const description = fileDescriptionInput.value.trim();
                let metadata = `Title: ${filename}\nDate: ${new Date().toLocaleString()}`;
                if (description) {
                    metadata += `\nDescription: ${description}`;
                }

                const fileContent = `/*
${metadata}
*/

${code}`;

                // Base64 encode content
                const contentEncoded = btoa(unescape(encodeURIComponent(fileContent)));

                const body = {
                    message: message,
                    content: contentEncoded
                };

                if (sha) {
                    body.sha = sha;
                }

                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (response.ok) {
                    alert('File saved successfully!');
                    saveModal.style.display = 'none';
                } else {
                    const errorData = await response.json();
                    alert('Error saving file: ' + (errorData.message || 'Unknown error'));
                }
            } catch (error) {
                alert('Network Error: ' + error.message);
            } finally {
                confirmSaveBtn.disabled = false;
                confirmSaveBtn.innerText = 'Save File';
            }
        });


        
        // Output Clear Button Logic
        const outputClearBtn = document.getElementById('outputClearBtn');
        if (outputClearBtn) {
            outputClearBtn.addEventListener('click', () => {
                outputArea.innerHTML = '';
                inputArea.value = '';
            });
        }


    </script>
</body>
</html>
