<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Syncer - Online Compiler</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        (function() {
            // Theme Loader
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.className = savedTheme;
            }

            // Wallpaper Loader (Prevents Flash)
            const url = localStorage.getItem('wallpaper_url') || '';
            const imageData = localStorage.getItem('wallpaper_image_data') || '';
            const effect = localStorage.getItem('wallpaper_effect') || 'normal';
            const blur = localStorage.getItem('wallpaper_blur') || '5';
            const transparent = localStorage.getItem('wallpaper_transparent') === 'true';
            const opacity = localStorage.getItem('wallpaper_opacity') || '80';

            document.addEventListener('DOMContentLoaded', () => {
                let wallpaperDiv = document.getElementById('wallpaper-background');
                if (!wallpaperDiv) {
                    wallpaperDiv = document.createElement('div');
                    wallpaperDiv.id = 'wallpaper-background';
                    document.body.prepend(wallpaperDiv);
                }

                const hasImage = url || imageData;
                if (hasImage) {
                    wallpaperDiv.style.backgroundImage = `url('${imageData || url}')`;
                    wallpaperDiv.style.opacity = '1';
                    document.body.style.backgroundColor = 'transparent';
                } else {
                    wallpaperDiv.style.backgroundImage = 'none';
                    wallpaperDiv.style.opacity = '0';
                    document.body.style.backgroundColor = '';
                }

                if (effect === 'blur') {
                    wallpaperDiv.style.filter = `blur(${blur}px)`;
                } else {
                    wallpaperDiv.style.filter = 'none';
                }
            });
        })();
    </script>
    <style>
        .compiler-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 100px);
            padding: 20px;
        }
        
        .editor-pane, .output-pane {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .pane-header {
            padding: 10px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-editor {
            flex: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .output-area {
            flex: 1;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .run-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .run-btn:hover {
            opacity: 0.9;
        }

        .lang-select {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .compiler-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .editor-pane, .output-pane {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="full-screen-layout" style="grid-template-columns: 1fr;">
        <header>
            <div style="display: flex; align-items: center;">
                <h1>>_ Code Syncer</h1>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="repository.html" class="nav-link">Repository</a>
                    <a href="compiler.html" class="nav-link active">Compiler</a>
                    <a href="aichat.html" class="nav-link">AI Chat</a>
                    <a href="streak.html" class="nav-link">Streak</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                    <a href="about.html" class="nav-link">About</a>
                </nav>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="theme-selector">
                    <select id="themeSelect">
                        <option value="theme-black">Black (Default)</option>
                        <option value="theme-white">White (Light)</option>
                        <option value="theme-green">Green (Matrix)</option>
                        <option value="theme-orange">Orange (Retro)</option>
                        <option value="theme-blue">Blue (Cyber)</option>
                        <option value="theme-dark">Dark (Modern)</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Save Modal -->
        <div id="saveModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Save to Repository</h2>
                    <span id="closeSaveModalBtn" class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="filenameInput">Filename</label>
                        <input type="text" id="filenameInput" class="text-input" placeholder="e.g. script.js">
                    </div>
                    <div class="form-group">
                        <label for="commitMessageInput">Commit Message (Optional)</label>
                        <input type="text" id="commitMessageInput" class="text-input" placeholder="Add new file">
                    </div>
                    <button id="confirmSaveBtn" class="btn">Save File</button>
                </div>
            </div>
        </div>

        <!-- AI Debug Modal -->
        <div id="aiDebugModal" class="modal">
            <div class="modal-content ai-modal-content" style="width: 90%; max-width: 1000px;">
                <div class="modal-header">
                    <h2 style="display: flex; align-items: center; gap: 10px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="10" x="3" y="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" x2="8" y1="16" y2="16"/><line x1="16" x2="16" y1="16" y2="16"/></svg>
                        AI Debugger
                    </h2>
                    <span id="closeAiDebugModalBtn" class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div id="aiDebugLoading" style="display: none; text-align: center; padding: 20px;">
                        <p>🤖 Analyzing error...</p>
                    </div>
                    <div id="aiDebugResult" style="display: none; flex-direction: column; gap: 15px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 400px;">
                            <div style="display: flex; flex-direction: column; overflow: hidden;">
                                <h4 style="color: var(--danger-color); margin-bottom: 5px;">❌ Original Code (Mistakes Underlined)</h4>
                                <div id="aiOriginalCode" class="output-area" style="flex: 1; overflow: auto; white-space: pre; font-family: 'Consolas', 'Monaco', monospace; border: 1px solid var(--danger-color);"></div>
                            </div>
                            <div style="display: flex; flex-direction: column; overflow: hidden;">
                                <h4 style="color: var(--success-color); margin-bottom: 5px;">✅ Fixed Code</h4>
                                <div id="aiFixedCode" class="output-area" style="flex: 1; overflow: auto; white-space: pre; font-family: 'Consolas', 'Monaco', monospace; border: 1px solid var(--success-color);"></div>
                            </div>
                        </div>
                        <div id="aiExplanation" style="padding: 10px; background: var(--input-bg); border-radius: 4px; border-left: 4px solid var(--primary-color);"></div>
                        <button id="applyFixBtn" class="btn" style="width: 100%;">Apply Fix</button>
                    </div>
                    <div id="aiDebugError" style="display: none; color: var(--danger-color); padding: 10px;"></div>
                </div>
            </div>
        </div>

        <div class="compiler-container">
            <div class="editor-pane">
                <div class="pane-header">
                    <select id="languageSelect" class="lang-select">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="html">HTML/CSS</option>
                    </select>
                    <div style="display: flex; gap: 10px;">
                        <button id="saveBtn" class="btn btn-small" style="display: flex; align-items: center; gap: 5px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                            Save
                        </button>
                        <button id="runBtn" class="run-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            Run Code
                        </button>
                    </div>
                </div>
                <textarea id="codeEditor" class="code-editor" spellcheck="false">// Write your code here
console.log("Hello, World!");
</textarea>
            </div>
            <div class="output-pane">
                <div class="pane-header">
                    <span>Input</span>
                </div>
                <textarea id="inputArea" class="code-editor" style="height: 100px; flex: none; border-bottom: 1px solid var(--border-color); background: #1e1e1e; color: #d4d4d4; font-family: 'Consolas', 'Monaco', monospace;" placeholder="Enter input here..."></textarea>
                <div class="pane-header">
                    <span>Output</span>
                    <div style="display: flex; gap: 5px;">
                        <button id="aiDebugBtn" class="btn btn-small" style="background-color: var(--primary-color); color: var(--bg-color); display: flex; align-items: center; gap: 5px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            AI Debug
                        </button>
                        <button id="clearBtn" class="btn btn-small">Clear</button>
                    </div>
                </div>
                <div id="outputArea" class="output-area"></div>
            </div>
        </div>

        <!-- AI Explanation Section -->
        <div style="margin-top: 20px;">
            <button id="initExplainBtn" class="btn" style="width: 100%; padding: 15px; background: var(--card-bg); border: 1px dashed var(--border-color); color: var(--text-color); cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 1.1rem; transition: all 0.3s ease;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                Explain Code with AI
            </button>

            <div id="explanationContainer" style="display: none; padding: 20px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                <div class="pane-header" style="background: transparent; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; padding-bottom: 10px;">
                    <span style="font-size: 1.2rem; font-weight: bold;">AI Code Explanation</span>
                    <button id="explainBtn" class="btn btn-small" style="background-color: var(--primary-color); color: var(--bg-color); display: flex; align-items: center; gap: 5px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        Restart Explanation
                    </button>
                </div>
                <div id="explanationChat" style="min-height: 150px; max-height: 500px; overflow-y: auto; resize: vertical; background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: var(--border-radius); font-family: 'Consolas', 'Monaco', monospace; white-space: pre-wrap; line-height: 1.6; margin-bottom: 10px;">
                    <div class="chat-placeholder" style="color: #888;">Click "Explain Code" to start.</div>
                </div>
                <div class="chat-input-area" style="display: flex; gap: 10px;">
                    <input type="text" id="followUpInput" placeholder="Ask a follow-up question..." style="flex: 1; padding: 10px; border-radius: var(--border-radius); border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);" disabled>
                    <button id="sendFollowUpBtn" class="btn btn-small" style="background-color: var(--primary-color); color: var(--bg-color);" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const runBtn = document.getElementById('runBtn');
        const saveBtn = document.getElementById('saveBtn');
        const clearBtn = document.getElementById('clearBtn');
        const codeEditor = document.getElementById('codeEditor');
        const outputArea = document.getElementById('outputArea');
        const inputArea = document.getElementById('inputArea');
        const languageSelect = document.getElementById('languageSelect');
        const themeSelect = document.getElementById('themeSelect');
        
        // Save Modal Elements
        const saveModal = document.getElementById('saveModal');
        const closeSaveModalBtn = document.getElementById('closeSaveModalBtn');
        const filenameInput = document.getElementById('filenameInput');
        const commitMessageInput = document.getElementById('commitMessageInput');
        const confirmSaveBtn = document.getElementById('confirmSaveBtn');

        // AI Debug Elements
        const aiDebugBtn = document.getElementById('aiDebugBtn');
        const aiDebugModal = document.getElementById('aiDebugModal');
        const closeAiDebugModalBtn = document.getElementById('closeAiDebugModalBtn');
        const aiDebugLoading = document.getElementById('aiDebugLoading');
        const aiDebugResult = document.getElementById('aiDebugResult');
        const aiDebugText = document.getElementById('aiDebugText');
        const aiDebugError = document.getElementById('aiDebugError');
        const applyFixBtn = document.getElementById('applyFixBtn');
        
        // AI Explanation Elements
        const initExplainBtn = document.getElementById('initExplainBtn');
        const explanationContainer = document.getElementById('explanationContainer');
        const explainBtn = document.getElementById('explainBtn');
        const explanationChat = document.getElementById('explanationChat');
        const followUpInput = document.getElementById('followUpInput');
        const sendFollowUpBtn = document.getElementById('sendFollowUpBtn');
        
        let explanationHistory = [];

        initExplainBtn.addEventListener('click', () => {
            initExplainBtn.style.display = 'none';
            explanationContainer.style.display = 'block';
            explainBtn.click();
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.style.marginBottom = '15px';
            div.style.padding = '10px';
            div.style.borderRadius = '8px';
            
            if (role === 'user') {
                div.style.background = 'rgba(88, 166, 255, 0.1)';
                div.style.borderLeft = '3px solid var(--primary-color)';
                div.innerHTML = `<strong>You:</strong><br>${escapeHtml(text)}`;
            } else {
                div.style.background = 'rgba(255, 255, 255, 0.05)';
                div.style.borderLeft = '3px solid var(--success-color)';
                
                // Parse code blocks
                let formattedText = escapeHtml(text);
                
                // Replace code blocks with styled divs and "Apply" button
                // Regex to find ```lang ... ``` blocks. 
                // Since we escaped HTML, we look for &lt;code&gt; or just the text pattern if escapeHtml didn't handle it yet.
                // Actually, let's process raw text first, then escape the non-code parts.
                
                // Better approach: Split by code blocks
                const parts = text.split(/```(\w*)\n([\s\S]*?)```/g);
                
                let html = `<strong>AI:</strong><br>`;
                
                for (let i = 0; i < parts.length; i++) {
                    if (i % 3 === 0) {
                        // Normal text
                        html += escapeHtml(parts[i]).replace(/\n/g, '<br>');
                    } else if (i % 3 === 1) {
                        // Language (ignored for now, or used for class)
                        // parts[i] is the language
                    } else {
                        // Code
                        const code = parts[i];
                        const codeId = 'code-' + Math.random().toString(36).substr(2, 9);
                        html += `<div style="margin-top: 10px; background: #111; padding: 10px; border-radius: 4px; position: relative;">
                            <pre style="margin: 0; overflow-x: auto;"><code>${escapeHtml(code)}</code></pre>
                            <button onclick="applyCodeToEditor('${codeId}')" style="position: absolute; top: 5px; right: 5px; padding: 4px 8px; background: var(--primary-color); color: var(--bg-color); border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Apply to Editor</button>
                            <textarea id="${codeId}" style="display: none;">${escapeHtml(code)}</textarea>
                        </div>`;
                    }
                }
                
                div.innerHTML = html;
            }
            
            // Remove placeholder if exists
            const placeholder = explanationChat.querySelector('.chat-placeholder');
            if (placeholder) placeholder.remove();
            
            explanationChat.appendChild(div);
            explanationChat.scrollTop = explanationChat.scrollHeight;
        }

        // Global function to apply code
        window.applyCodeToEditor = function(id) {
            const textarea = document.getElementById(id);
            if (textarea) {
                // Decode the escaped HTML back to normal text for the editor
                const txt = document.createElement('textarea');
                txt.innerHTML = textarea.value;
                codeEditor.value = txt.value;
                alert('Code applied to editor!');
            }
        };

        // Theme handling
        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            document.documentElement.className = theme;
            localStorage.setItem('theme', theme);
        });

        // Set initial theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            themeSelect.value = savedTheme;
            document.documentElement.className = savedTheme;
        }

        // Check for code from repository
        const importedCode = localStorage.getItem('compiler_code');
        const importedLang = localStorage.getItem('compiler_lang');
        const lastUsedLang = localStorage.getItem('compiler_last_lang');

        // Default code snippets
        const snippets = {
            javascript: `// JavaScript Example
console.log("Hello from Code Syncer!");
const sum = (a, b) => a + b;
console.log("2 + 3 =", sum(2, 3));`,
            python: `# Python Example
def greet(name):
    return f"Hello, {name}!"

print(greet("Developer"))`,
            java: `// Java Example
public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from Java!");
    }
}`,
            html: `<!-- HTML Example -->
<div style="color: blue; font-weight: bold;">
    Hello from HTML!
</div>`
        };

        if (importedCode) {
            codeEditor.value = importedCode;
            if (importedLang) {
                languageSelect.value = importedLang;
                localStorage.setItem('compiler_last_lang', importedLang);
            }
            // Clear storage so it doesn't persist on refresh/navigation
            localStorage.removeItem('compiler_code');
            localStorage.removeItem('compiler_lang');
        } else if (lastUsedLang) {
            languageSelect.value = lastUsedLang;
            codeEditor.value = snippets[lastUsedLang] || '';
        }

        languageSelect.addEventListener('change', () => {
            const lang = languageSelect.value;
            localStorage.setItem('compiler_last_lang', lang);
            
            // Only overwrite if the current code is empty or matches one of the default snippets
            const currentCode = codeEditor.value.trim();
            const isDefaultSnippet = Object.values(snippets).some(s => s.trim() === currentCode);
            
            if (currentCode === '' || isDefaultSnippet || confirm("Changing language will reset the code editor. Continue?")) {
                codeEditor.value = snippets[lang] || '';
                outputArea.innerHTML = '';
            } else {
                // Revert selection if cancelled (optional, but tricky without previous value)
                // For now, we just don't change the code, but the select value changed.
                // That's actually fine, maybe they just wanted to change the runner language but keep code.
            }
        });

        runBtn.addEventListener('click', async () => {
            const lang = languageSelect.value;
            const code = codeEditor.value;
            const input = inputArea.value;
            outputArea.innerHTML = '';

            if (lang === 'javascript') {
                try {
                    // Capture console.log
                    const originalLog = console.log;
                    const logs = [];
                    console.log = (...args) => {
                        logs.push(args.map(arg => 
                            typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                        ).join(' '));
                    };

                    // Mock prompt for input
                    const originalPrompt = window.prompt;
                    const inputLines = input.split('\n');
                    let inputIndex = 0;
                    window.prompt = (message) => {
                        if (inputIndex < inputLines.length) {
                            return inputLines[inputIndex++];
                        }
                        return '';
                    };

                    // Execute code
                    eval(code);

                    // Restore console.log and prompt
                    console.log = originalLog;
                    window.prompt = originalPrompt;

                    // Display output
                    if (logs.length > 0) {
                        outputArea.innerText = logs.join('\\n');
                    } else {
                        outputArea.innerText = 'Code executed successfully (no output).';
                    }
                } catch (error) {
                    outputArea.innerHTML = `<span style="color: var(--danger-color)">Error: ${error.message}</span>`;
                }
            } else if (lang === 'html') {
                const iframe = document.createElement('iframe');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.style.background = 'white';
                outputArea.appendChild(iframe);
                
                const doc = iframe.contentWindow.document;
                doc.open();
                doc.write(code);
                doc.close();
            } else {
                // Piston API for Python and Java
                outputArea.innerText = 'Running code...';
                
                try {
                    const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            language: lang,
                            version: lang === 'java' ? '15.0.2' : '3.10.0',
                            files: [
                                {
                                    content: code
                                }
                            ],
                            stdin: input
                        })
                    });

                    const data = await response.json();
                    
                    if (data.run) {
                        outputArea.innerText = data.run.output;
                    } else {
                        outputArea.innerText = 'Error executing code: ' + (data.message || 'Unknown error');
                    }
                } catch (error) {
                    outputArea.innerText = 'Network Error: ' + error.message;
                }
            }
        });

        clearBtn.addEventListener('click', () => {
            outputArea.innerHTML = '';
        });

        // Save Functionality
        saveBtn.addEventListener('click', () => {
            const lang = languageSelect.value;
            let ext = '.txt';
            if (lang === 'javascript') ext = '.js';
            else if (lang === 'python') ext = '.py';
            else if (lang === 'java') ext = '.java';
            else if (lang === 'html') ext = '.html';
            
            // Suggest a filename
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            filenameInput.value = `snippet_${timestamp}${ext}`;
            saveModal.style.display = 'block';
        });

        closeSaveModalBtn.addEventListener('click', () => {
            saveModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === saveModal) {
                saveModal.style.display = 'none';
            }
        });

        confirmSaveBtn.addEventListener('click', async () => {
            const token = localStorage.getItem('github_token');
            const owner = localStorage.getItem('github_username');
            const repo = localStorage.getItem('github_repo');
            const code = codeEditor.value;
            const filename = filenameInput.value.trim();
            const message = commitMessageInput.value.trim() || `Add ${filename}`;

            if (!token || !owner || !repo) {
                alert('Please configure your GitHub settings in the Repository page first.');
                return;
            }

            if (!filename) {
                alert('Please enter a filename.');
                return;
            }

            confirmSaveBtn.disabled = true;
            confirmSaveBtn.innerText = 'Saving...';

            try {
                // Check if file exists to get SHA (for update)
                let sha = null;
                try {
                    const checkResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (checkResponse.ok) {
                        const data = await checkResponse.json();
                        sha = data.sha;
                        if (!confirm(`File ${filename} already exists. Overwrite?`)) {
                            confirmSaveBtn.disabled = false;
                            confirmSaveBtn.innerText = 'Save File';
                            return;
                        }
                    }
                } catch (e) {
                    // Ignore error if file doesn't exist
                }

                // Create file content with metadata header
                const fileContent = `/*
Title: ${filename}
Date: ${new Date().toLocaleString()}
*/

${code}`;

                // Base64 encode content
                const contentEncoded = btoa(unescape(encodeURIComponent(fileContent)));

                const body = {
                    message: message,
                    content: contentEncoded
                };

                if (sha) {
                    body.sha = sha;
                }

                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (response.ok) {
                    alert('File saved successfully!');
                    saveModal.style.display = 'none';
                } else {
                    const errorData = await response.json();
                    alert('Error saving file: ' + (errorData.message || 'Unknown error'));
                }
            } catch (error) {
                alert('Network Error: ' + error.message);
            } finally {
                confirmSaveBtn.disabled = false;
                confirmSaveBtn.innerText = 'Save File';
            }
        });

        // AI Debug Functionality
        let suggestedFix = null;
        const aiOriginalCode = document.getElementById('aiOriginalCode');
        const aiFixedCode = document.getElementById('aiFixedCode');
        const aiExplanation = document.getElementById('aiExplanation');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        aiDebugBtn.addEventListener('click', async () => {
            const code = codeEditor.value;
            const output = outputArea.innerText;
            const lang = languageSelect.value;
            const key = localStorage.getItem('ai_api_key');

            if (!key) {
                alert('Please configure your AI API Key in the Repository Settings first.');
                return;
            }

            if (!output || output.trim() === '') {
                alert('No output to analyze. Run the code first.');
                return;
            }

            aiDebugModal.style.display = 'block';
            aiDebugLoading.style.display = 'block';
            aiDebugResult.style.display = 'none';
            aiDebugError.style.display = 'none';
            suggestedFix = null;

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Code Syncer'
                    },
                    body: JSON.stringify({
                        model: "meta-llama/llama-3.3-70b-instruct:free",
                        messages: [
                            {
                                role: "system",
                                content: `You are an expert programmer. Analyze the code and the error output.
Return ONLY a valid JSON object with this structure:
{
    "explanation": "Brief explanation of the error",
    "fixed_code": "The complete fixed code string",
    "error_lines": [1, 3]
}
"error_lines" should be an array of line numbers (1-based) where the errors are located.
Do not include markdown formatting or backticks.`
                            },
                            {
                                role: "user",
                                content: `Language: ${lang}\n\nCode:\n${code}\n\nOutput/Error:\n${output}`
                            }
                        ]
                    })
                });

                if (!response.ok) throw new Error('AI API Error');

                const data = await response.json();
                let content = data.choices[0].message.content;
                
                // Clean up if the model wraps in markdown
                content = content.replace(/```json/g, '').replace(/```/g, '').trim();
                
                let result;
                try {
                    result = JSON.parse(content);
                } catch (e) {
                    // Fallback if JSON parsing fails
                    console.error("Failed to parse AI JSON", content);
                    throw new Error("AI response was not in valid JSON format.");
                }

                // Render Original Code with Highlights
                const lines = code.split('\n');
                const errorLines = new Set(result.error_lines || []);
                
                aiOriginalCode.innerHTML = lines.map((line, index) => {
                    const lineNum = index + 1;
                    if (errorLines.has(lineNum)) {
                        return `<div style="background: rgba(218, 54, 51, 0.2); text-decoration: underline; text-decoration-style: wavy; text-decoration-color: var(--danger-color); padding: 0 5px;">${escapeHtml(line)}</div>`;
                    }
                    return `<div style="padding: 0 5px;">${escapeHtml(line)}</div>`;
                }).join('');
                
                // Render Fixed Code
                const fixedLines = result.fixed_code.split('\n');
                aiFixedCode.innerHTML = fixedLines.map(line => {
                    return `<div style="padding: 0 5px;">${escapeHtml(line)}</div>`;
                }).join('');
                
                // Render Explanation
                aiExplanation.textContent = result.explanation;
                
                suggestedFix = result.fixed_code;
                
                aiDebugLoading.style.display = 'none';
                aiDebugResult.style.display = 'flex';

            } catch (error) {
                aiDebugLoading.style.display = 'none';
                aiDebugError.innerText = 'Error: ' + error.message;
                aiDebugError.style.display = 'block';
            }
        });

        closeAiDebugModalBtn.addEventListener('click', () => {
            aiDebugModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === aiDebugModal) {
                aiDebugModal.style.display = 'none';
            }
        });

        applyFixBtn.addEventListener('click', () => {
            if (suggestedFix) {
                codeEditor.value = suggestedFix;
                aiDebugModal.style.display = 'none';
                alert('Code updated with AI fix!');
            }
        });

        // AI Explanation Functionality
        explainBtn.addEventListener('click', async () => {
            const code = codeEditor.value;
            const lang = languageSelect.value;
            const key = localStorage.getItem('ai_api_key');

            if (!key) {
                alert('Please configure your AI API Key in the Repository Settings first.');
                return;
            }

            if (!code || code.trim() === '') {
                alert('Please enter some code to explain.');
                return;
            }

            explainBtn.disabled = true;
            explainBtn.innerHTML = 'Explaining...';
            
            // Reset chat
            explanationChat.innerHTML = '';
            explanationHistory = [
                {
                    role: "system",
                    content: "You are an expert programmer. Explain the code clearly and concisely for a beginner. Focus on the logic and flow. Be ready to answer follow-up questions. If you provide code examples, please include comments explaining the logic."
                },
                {
                    role: "user",
                    content: `Language: ${lang}\n\nCode:\n${code}\n\nPlease explain this code.`
                }
            ];

            appendMessage('user', 'Please explain this code.');
            
            // Enable input for follow-up
            followUpInput.disabled = false;
            sendFollowUpBtn.disabled = false;

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Code Syncer'
                    },
                    body: JSON.stringify({
                        model: "meta-llama/llama-3.3-70b-instruct:free",
                        messages: explanationHistory
                    })
                });

                if (!response.ok) throw new Error('AI API Error');

                const data = await response.json();
                const content = data.choices[0].message.content;
                
                explanationHistory.push({ role: "assistant", content: content });
                appendMessage('assistant', content);

            } catch (error) {
                appendMessage('assistant', 'Error: ' + error.message);
            } finally {
                explainBtn.disabled = false;
                explainBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    Explain Code
                `;
            }
        });

        sendFollowUpBtn.addEventListener('click', async () => {
            const question = followUpInput.value.trim();
            const key = localStorage.getItem('ai_api_key');
            
            if (!question) return;
            
            appendMessage('user', question);
            followUpInput.value = '';
            followUpInput.disabled = true;
            sendFollowUpBtn.disabled = true;
            sendFollowUpBtn.innerText = '...';
            
            explanationHistory.push({ role: "user", content: question });

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Code Syncer'
                    },
                    body: JSON.stringify({
                        model: "meta-llama/llama-3.3-70b-instruct:free",
                        messages: explanationHistory
                    })
                });

                if (!response.ok) throw new Error('AI API Error');

                const data = await response.json();
                const content = data.choices[0].message.content;
                
                explanationHistory.push({ role: "assistant", content: content });
                appendMessage('assistant', content);

            } catch (error) {
                appendMessage('assistant', 'Error: ' + error.message);
            } finally {
                followUpInput.disabled = false;
                sendFollowUpBtn.disabled = false;
                sendFollowUpBtn.innerText = 'Send';
                followUpInput.focus();
            }
        });

        followUpInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendFollowUpBtn.click();
            }
        });
    </script>
</body>
</html>
