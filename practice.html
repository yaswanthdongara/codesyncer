<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Syncer - Practice</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) document.documentElement.className = savedTheme;
            
            // Wallpaper Loader
            const url = localStorage.getItem('wallpaper_url') || '';
            const imageData = localStorage.getItem('wallpaper_image_data') || '';
            const effect = localStorage.getItem('wallpaper_effect') || 'normal';
            const blur = localStorage.getItem('wallpaper_blur') || '5';
            
            document.addEventListener('DOMContentLoaded', () => {
                let wallpaperDiv = document.getElementById('wallpaper-background');
                if (!wallpaperDiv) {
                    wallpaperDiv = document.createElement('div');
                    wallpaperDiv.id = 'wallpaper-background';
                    document.body.prepend(wallpaperDiv);
                }
                const hasImage = url || imageData;
                if (hasImage) {
                    wallpaperDiv.style.backgroundImage = `url('${imageData || url}')`;
                    wallpaperDiv.style.opacity = '1';
                    document.body.style.backgroundColor = 'transparent';
                } else {
                    wallpaperDiv.style.backgroundImage = 'none';
                    wallpaperDiv.style.opacity = '0';
                    document.body.style.backgroundColor = '';
                }
                if (effect === 'blur') wallpaperDiv.style.filter = `blur(${blur}px)`;
                else wallpaperDiv.style.filter = 'none';
            });
        })();
    </script>
    <style>
        .practice-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            height: calc(100vh - 70px); /* Adjust for header */
            gap: 10px;
            padding: 10px;
        }
        
        .problem-pane {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .problem-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
        }

        .problem-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .problem-content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 10px 0;
        }

        .problem-content pre {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .problem-content code {
            font-family: var(--font-family);
            background: rgba(255,255,255,0.1);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .editor-pane {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .editor-container {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .output-container {
            height: 200px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tag-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-right: 5px;
            background: rgba(88, 166, 255, 0.2);
            color: var(--primary-color);
        }

        .difficulty-easy { color: #00b8a3; }
        .difficulty-medium { color: #ffc01e; }
        .difficulty-hard { color: #ff375f; }

        /* Search Modal */
        .search-results {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .search-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .search-item:hover {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <div class="full-screen-layout" style="grid-template-columns: 1fr; height: 100vh; padding: 0;">
        <header style="padding: 10px 20px; margin: 0;">
            <div style="display: flex; align-items: center;">
                <h1>>_ Code Syncer</h1>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="repository.html" class="nav-link">Repository</a>
                    <a href="compiler.html" class="nav-link">Compiler</a>
                    <a href="practice.html" class="nav-link active">Practice</a>
                    <a href="aichat.html" class="nav-link">AI Chat</a>
                    <a href="streak.html" class="nav-link">Streak</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                    <a href="about.html" class="nav-link">About</a>
                </nav>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="problemListBtn" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    Problems
                </button>
                <button id="dailyBtn" class="btn" style="background: linear-gradient(45deg, #ffc01e, #ff375f); border: none; color: white;">
                    🔥 Daily Challenge
                </button>
                <div class="theme-selector">
                    <select id="themeSelect">
                        <option value="theme-black">Black</option>
                        <option value="theme-white">White</option>
                        <option value="theme-green">Green</option>
                        <option value="theme-orange">Orange</option>
                        <option value="theme-blue">Blue</option>
                        <option value="theme-dark">Dark</option>
                    </select>
                </div>
            </div>
        </header>

        <div class="practice-layout">
            <!-- Left: Problem Description -->
            <div class="problem-pane">
                <div class="problem-header">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                        <h2 id="problemTitle" style="margin: 0; font-size: 1.2rem;">Select a Problem</h2>
                        <span id="problemDifficulty" style="font-weight: bold;"></span>
                    </div>
                    <div id="problemTags" style="margin-top: 5px;"></div>
                </div>
                <div id="problemBody" class="problem-content">
                    <div style="text-align: center; color: #888; margin-top: 50px;">
                        <p>Click "Problems" or "Daily Challenge" to start.</p>
                    </div>
                </div>
            </div>

            <!-- Right: Editor & Output -->
            <div class="editor-pane">
                <div class="editor-container">
                    <div class="pane-header" style="padding: 10px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <select id="languageSelect" class="text-input" style="padding: 5px;">
                                <option value="python">Python</option>
                                <option value="javascript">JavaScript</option>
                                <option value="java">Java</option>
                                <option value="cpp">C++</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button id="runBtn" class="btn btn-success">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                                Run Code
                            </button>
                        </div>
                    </div>
                    <textarea id="codeEditor" style="flex: 1; background: transparent; color: var(--text-color); border: none; padding: 15px; font-family: var(--font-family); resize: none; outline: none; white-space: pre; overflow: auto;" spellcheck="false"></textarea>
                </div>

                <div class="output-container">
                    <div class="pane-header" style="padding: 10px; border-bottom: 1px solid var(--border-color);">
                        <strong>Output / Test Results</strong>
                    </div>
                    <div id="outputConsole" style="flex: 1; padding: 15px; font-family: var(--font-family); white-space: pre-wrap; overflow-y: auto; color: #d4d4d4;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Problem List Modal -->
    <div id="problemModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Select Problem</h2>
                <span class="close" id="closeProblemModal">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" id="problemSearch" class="text-input" placeholder="Search problems..." style="width: 100%; margin-bottom: 10px;">
                <div id="problemList" class="search-results">
                    <div style="text-align: center; padding: 20px;">Loading problems...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="tracker.js"></script>
    <script>
        // Practice Page Logic
        const API_BASE = 'https://alfa-leetcode-api.onrender.com';
        
        const problemTitle = document.getElementById('problemTitle');
        const problemDifficulty = document.getElementById('problemDifficulty');
        const problemTags = document.getElementById('problemTags');
        const problemBody = document.getElementById('problemBody');
        const codeEditor = document.getElementById('codeEditor');
        const outputConsole = document.getElementById('outputConsole');
        const runBtn = document.getElementById('runBtn');
        const languageSelect = document.getElementById('languageSelect');
        
        // Modal
        const problemModal = document.getElementById('problemModal');
        const problemListBtn = document.getElementById('problemListBtn');
        const closeProblemModal = document.getElementById('closeProblemModal');
        const problemList = document.getElementById('problemList');
        const problemSearch = document.getElementById('problemSearch');
        const dailyBtn = document.getElementById('dailyBtn');

        let allProblems = [];

        // Event Listeners
        problemListBtn.addEventListener('click', openProblemList);
        closeProblemModal.addEventListener('click', () => problemModal.style.display = 'none');
        dailyBtn.addEventListener('click', loadDailyChallenge);
        
        problemSearch.addEventListener('input', (e) => {
            filterProblems(e.target.value);
        });

        runBtn.addEventListener('click', runCode);

        // Editor Tab Support
        codeEditor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });

        // Functions
        async function openProblemList() {
            problemModal.style.display = 'block';
            if (allProblems.length === 0) {
                try {
                    const res = await fetch(`${API_BASE}/problems?limit=100`); // Fetch top 100
                    const data = await res.json();
                    allProblems = data.problemsetQuestionList;
                    renderProblemList(allProblems);
                } catch (e) {
                    problemList.innerHTML = '<div style="color: var(--danger-color)">Failed to load problems. API might be down.</div>';
                }
            }
        }

        function renderProblemList(problems) {
            problemList.innerHTML = '';
            problems.forEach(p => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerHTML = `
                    <span>${p.questionFrontendId}. ${p.title}</span>
                    <span class="${getDifficultyClass(p.difficulty)}">${p.difficulty}</span>
                `;
                div.onclick = () => {
                    loadProblem(p.titleSlug);
                    problemModal.style.display = 'none';
                };
                problemList.appendChild(div);
            });
        }

        function filterProblems(query) {
            const lower = query.toLowerCase();
            const filtered = allProblems.filter(p => 
                p.title.toLowerCase().includes(lower) || 
                p.questionFrontendId.toString().includes(lower)
            );
            renderProblemList(filtered);
        }

        function getDifficultyClass(diff) {
            if (diff === 'Easy') return 'difficulty-easy';
            if (diff === 'Medium') return 'difficulty-medium';
            return 'difficulty-hard';
        }

        async function loadDailyChallenge() {
            try {
                problemBody.innerHTML = '<div style="text-align: center; margin-top: 50px;">Loading Daily Challenge...</div>';
                const res = await fetch(`${API_BASE}/daily`);
                const data = await res.json();
                // The daily endpoint returns metadata, we might need to fetch full details if 'question' is missing
                // But usually it has it.
                if (!data.question) {
                    loadProblem(data.titleSlug);
                } else {
                    renderProblem(data);
                }
            } catch (e) {
                problemBody.innerHTML = '<div style="color: var(--danger-color)">Failed to load daily challenge.</div>';
            }
        }

        async function loadProblem(slug) {
            try {
                problemBody.innerHTML = '<div style="text-align: center; margin-top: 50px;">Loading Problem...</div>';
                const res = await fetch(`${API_BASE}/select?titleSlug=${slug}`);
                const data = await res.json();
                renderProblem(data);
            } catch (e) {
                problemBody.innerHTML = '<div style="color: var(--danger-color)">Failed to load problem details.</div>';
            }
        }

        function renderProblem(data) {
            problemTitle.textContent = `${data.questionFrontendId}. ${data.questionTitle}`;
            problemDifficulty.textContent = data.difficulty;
            problemDifficulty.className = getDifficultyClass(data.difficulty);
            
            problemTags.innerHTML = '';
            if (data.topicTags) {
                data.topicTags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag-badge';
                    span.textContent = tag.name;
                    problemTags.appendChild(span);
                });
            }

            problemBody.innerHTML = data.question;
            
            // Set default code template based on language
            // Note: The API might not return code snippets. We'll use a generic one.
            const lang = languageSelect.value;
            codeEditor.value = getStarterCode(lang, data.questionTitle);
        }

        function getStarterCode(lang, title) {
            const safeTitle = title.replace(/ /g, '');
            if (lang === 'python') return `class Solution:\n    def solve(self):\n        # Write your code here\n        pass\n\n# Driver Code\nif __name__ == "__main__":\n    sol = Solution()\n    print(sol.solve())`;
            if (lang === 'javascript') return `class Solution {\n    solve() {\n        // Write your code here\n    }\n}\n\nconst sol = new Solution();\nconsole.log(sol.solve());`;
            if (lang === 'java') return `public class Main {\n    public static void main(String[] args) {\n        Solution sol = new Solution();\n        // Call your method here\n    }\n}\n\nclass Solution {\n    public void solve() {\n        // Write your code here\n    }\n}`;
            return `// Write your code here`;
        }

        async function runCode() {
            const code = codeEditor.value;
            const lang = languageSelect.value;
            
            if (!code.trim()) return;

            outputConsole.textContent = 'Running...';
            
            // Use Piston API (same as compiler.html)
            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: lang,
                        version: '*',
                        files: [{ content: code }]
                    })
                });

                const data = await response.json();
                
                if (data.run) {
                    let output = data.run.stdout || '';
                    if (data.run.stderr) {
                        output += '\nError:\n' + data.run.stderr;
                    }
                    outputConsole.textContent = output || 'No output';
                } else {
                    outputConsole.textContent = 'Execution failed';
                }
            } catch (e) {
                outputConsole.textContent = 'Error: ' + e.message;
            }
        }
        
        // Theme Logic
        const themeSelect = document.getElementById('themeSelect');
        themeSelect.value = localStorage.getItem('theme') || 'theme-black';
        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            document.documentElement.className = theme;
            localStorage.setItem('theme', theme);
        });
    </script>
</body>
</html>
