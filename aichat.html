<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Syncer - AI Chat</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        (function() {
            // Theme Loader
            const savedTheme = localStorage.getItem('theme') || 'theme-black';
            document.documentElement.className = savedTheme;

            // Wallpaper Loader (Prevents Flash)
            const url = localStorage.getItem('wallpaper_url') || '';
            const imageData = localStorage.getItem('wallpaper_image_data') || '';
            const effect = localStorage.getItem('wallpaper_effect') || 'normal';
            const blur = localStorage.getItem('wallpaper_blur') || '5';
            const transparent = localStorage.getItem('wallpaper_transparent') === 'true';
            const opacity = localStorage.getItem('wallpaper_opacity') || '80';

            document.addEventListener('DOMContentLoaded', () => {
                let wallpaperDiv = document.getElementById('wallpaper-background');
                if (!wallpaperDiv) {
                    wallpaperDiv = document.createElement('div');
                    wallpaperDiv.id = 'wallpaper-background';
                    document.body.prepend(wallpaperDiv);
                }

                const hasImage = url || imageData;
                if (hasImage) {
                    wallpaperDiv.style.backgroundImage = `url('${imageData || url}')`;
                    wallpaperDiv.style.opacity = '1';
                    document.body.style.backgroundColor = 'transparent';
                } else {
                    wallpaperDiv.style.backgroundImage = 'none';
                    wallpaperDiv.style.opacity = '0';
                    document.body.style.backgroundColor = '';
                }

                if (effect === 'blur') {
                    wallpaperDiv.style.filter = `blur(${blur}px)`;
                } else {
                    wallpaperDiv.style.filter = 'none';
                }
            });
        })();
    </script>
</head>
<body style="padding: 0; overflow: hidden;">
    <div class="full-screen-layout" style="grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 0; height: 100vh; padding: 10px;">
        <header style="margin-bottom: 0; padding-bottom: 10px;">
            <div style="display: flex; align-items: center;">
                <h1>>_ Code Syncer</h1>
                <nav class="main-nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="repository.html" class="nav-link">Repository</a>
                    <a href="compiler.html" class="nav-link">Compiler</a>
                    <a href="aichat.html" class="nav-link active">AI Chat</a>
                    <a href="streak.html" class="nav-link">Streak</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                    <a href="about.html" class="nav-link">About</a>
                </nav>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="font-controls" style="display: flex; gap: 5px; align-items: center; margin-right: 10px;">
                    <button id="decreaseFontBtn" class="btn btn-small" style="font-weight: bold; width: 30px;">-</button>
                    <div id="fontSizeDisplay" style="padding: 5px 10px; border: 1px solid var(--border-color); background: var(--input-bg); border-radius: var(--border-radius); min-width: 40px; text-align: center; font-size: 0.9rem;">14px</div>
                    <button id="increaseFontBtn" class="btn btn-small" style="font-weight: bold; width: 30px;">+</button>
                </div>
                <button id="settingsBtn" class="btn-icon" title="Profile Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </button>
                <div class="theme-selector">
                    <select id="themeSelect">
                        <option value="theme-black">Black (Default)</option>
                        <option value="theme-white">White (Light)</option>
                        <option value="theme-green">Green (Matrix)</option>
                        <option value="theme-orange">Orange (Retro)</option>
                        <option value="theme-blue">Blue (Cyber)</option>
                        <option value="theme-dark">Dark (Modern)</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Configuration</h2>
                    <span id="closeSettingsBtn" class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="usernameInput">GitHub Username</label>
                        <input type="text" id="usernameInput" class="text-input" placeholder="e.g. johndoe">
                    </div>
                    <div class="form-group">
                        <label for="repoInput">Repository Name</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="repoInput" class="text-input" placeholder="e.g. codesyncer">
                            <button id="createRepoBtn" class="btn btn-small" title="Create this repository on GitHub">Create Repo</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="tokenInput">GitHub Personal Access Token</label>
                        <input type="password" id="tokenInput" class="text-input" placeholder="ghp_...">
                        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">
                            Token is stored locally. <a href="https://github.com/settings/tokens" target="_blank" style="color: var(--primary-color);">Generate a token</a> with 'repo' scope.
                        </p>
                    </div>
                    <div class="form-group">
                        <label for="aiKeyInput">OpenRouter API Key (Optional)</label>
                        <input type="password" id="aiKeyInput" class="text-input" placeholder="sk-or-...">
                        <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">
                            Required for AI code generation. Stored locally. <a href="https://openrouter.ai/keys" target="_blank" style="color: var(--primary-color);">Get API Key</a>
                        </p>
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

                    <h3>Wallpaper Settings</h3>
                    <div class="form-group">
                        <label for="wallpaperUrlInput">Wallpaper URL</label>
                        <input type="text" id="wallpaperUrlInput" class="text-input" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="form-group">
                        <label for="wallpaperFileInput">Or Upload Image</label>
                        <input type="file" id="wallpaperFileInput" class="text-input" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="wallpaperEffectSelect">Effect</label>
                        <select id="wallpaperEffectSelect" class="text-input">
                            <option value="normal">Normal</option>
                            <option value="blur">Blur</option>
                        </select>
                    </div>
                    <div class="form-group" style="display: none; align-items: center; gap: 10px;">
                        <label for="wallpaperBlurRange" style="margin: 0;">Blur Level:</label>
                        <input type="range" id="wallpaperBlurRange" min="0" max="20" value="5" style="flex: 1;">
                        <span id="wallpaperBlurValue">5px</span>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                        <input type="checkbox" id="wallpaperTransparentCheckbox">
                        <label for="wallpaperTransparentCheckbox" style="margin: 0;">Transparent Containers</label>
                    </div>
                    <div class="form-group" id="wallpaperOpacityGroup" style="display: none; align-items: center; gap: 10px;">
                        <label for="wallpaperOpacityRange" style="margin: 0;">Opacity:</label>
                        <input type="range" id="wallpaperOpacityRange" min="0" max="100" value="80" style="flex: 1;">
                        <span id="wallpaperOpacityValue">0.8</span>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
                    
                    <h3>Chat Options</h3>
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <button id="chatExportPdfBtn" class="btn btn-secondary" style="flex: 1;">Export Chat as PDF</button>
                        <button id="chatClearBtn" class="btn btn-danger" style="flex: 1;">Clear Chat History</button>
                    </div>

                    <button id="saveTokenBtn" class="btn">Save Configuration</button>
                </div>
            </div>
        </div>

        <div class="chat-section" style="display: flex; flex-direction: column; height: 100%; width: 100%; padding: 0; overflow: hidden;">
            <div id="chatHistory" class="chat-history" style="flex-grow: 1; overflow-y: auto; padding: 20px; border: none; border-radius: 0; background: transparent; margin-bottom: 0;">
                <!-- Chat messages will appear here -->
                <div class="chat-welcome" style="text-align: center; opacity: 0.7; margin-top: 50px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;"><rect width="18" height="10" x="3" y="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" x2="8" y1="16" y2="16"/><line x1="16" x2="16" y1="16" y2="16"/></svg>
                    <p>Start a conversation with the AI...</p>
                </div>
            </div>
            
            <div class="chat-input-area" style="display: flex; gap: 10px; align-items: flex-end; padding: 10px 20px; border-top: 1px solid var(--border-color); background: transparent;">
                <textarea id="chatInput" class="text-input" placeholder="Type your message..." rows="1" style="flex-grow: 1; min-height: 50px; max-height: 200px; resize: none; border: none; background: transparent; padding: 10px; overflow-y: hidden;"></textarea>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <button id="chatSendBtn" class="btn" style="height: 40px;">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
